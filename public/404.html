<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>The Sales Algorithm with JK</title>
    <script>
      // GitHub Pages SPA redirect hack
      // When GitHub Pages serves a 404, this script saves the path and
      // redirects to index.html, which restores the URL via replaceState.
      // pathSegmentsToKeep = 1 for project sites (username.github.io/repo-name/)
      // pathSegmentsToKeep = 0 for custom domains (thesalesalgorithm.org/)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      sessionStorage.setItem('spa-redirect', l.pathname.slice(1) + l.search + l.hash);
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + l.pathname.split('/').slice(1, 1 + pathSegmentsToKeep).join('/') + '/');
    </script>
  </head>
  <body>
  </body>
</html>
